# Project profile template for sap-calcview-to-dbt.
# Copy this file into the project's working folder as project_profile.yaml.
# If the file exists, the skill follows it as-is (file-first; the skill
# only asks when the file is absent). The values below are generic dummy
# defaults so the pipeline runs end-to-end — replace them per project.
# dbt layer layouts and landing conventions differ per project, so treat
# every value here as a placeholder, not a standard.

landing:
  database: "RAW"     # dummy: Snowflake database where source tables land
  raw_schema: "SAP"   # dummy: schema for landed SAP tables (mapping.csv)
  table_naming: same  # same | prefixed | lower_snake

view_references:
  # Calculation views used as data sources of other views:
  connect_to: models  # models (converted dbt models) | landed_tables

dbt_layers:
  staging:     { dir: staging,      prefix: stg_ }
  intermediate: { dir: intermediate, prefix: int_ }
  marts:       { dir: marts,        prefix: "" }
  sources_yml: models/_sources.yml

layer_split:
  # What becomes an intermediate model, what stays a CTE, what is a mart.
  int_when: ["node_count > 10", "shared_by_multiple_views"]
  mart_is: final_node # final_node | per_business_domain
  notes: ""

conventions:
  client_filter: ""   # how the SAP client (MANDT) filter is handled
  currency_uom: ""    # policy for currency / UOM conversion (spec section 9)
